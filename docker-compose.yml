version: '3.8'

services:
  # Servidor Web (PHP 8.2 + Apache)
  app:
    build: .
    container_name: barber_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  # Banco de Dados (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: barber_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barber_control
    volumes:
      - barber_db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 10s
      retries: 5

volumes:
  barber_db_data: